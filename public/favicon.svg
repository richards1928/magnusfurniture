<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="#3E2723"/>
  <!-- Outer hexagonal ring -->
  <polygon points="50,6 90,28 90,72 50,94 10,72 10,28"
           fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.4"/>
  <!-- Left stem -->
  <rect x="18" y="28" width="10" height="44" rx="1.5" fill="#D4AF37"/>
  <!-- Right stem -->
  <rect x="72" y="28" width="10" height="44" rx="1.5" fill="#D4AF37"/>
  <!-- Left diagonal -->
  <polygon points="18,28 28,28 50,58 44,65" fill="#D4AF37"/>
  <!-- Right diagonal -->
  <polygon points="82,28 72,28 50,58 56,65" fill="#D4AF37"/>
  <!-- Center V valley -->
  <polygon points="44,65 50,58 56,65 50,72" fill="#B8962E" opacity="0.85"/>
  <!-- Top serif bars -->
  <rect x="14" y="26" width="18" height="4" rx="1" fill="#D4AF37" opacity="0.6"/>
  <rect x="68" y="26" width="18" height="4" rx="1" fill="#D4AF37" opacity="0.6"/>
  <!-- Bottom serif bars -->
  <rect x="14" y="68" width="18" height="4" rx="1" fill="#D4AF37" opacity="0.6"/>
  <rect x="68" y="68" width="18" height="4" rx="1" fill="#D4AF37" opacity="0.6"/>
</svg>